<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>NFL Stadiums Collection</title>
  </head>
  <body>
    <header>
      <div class="content-width">
        <p>NFL Stadiums</p>
        <nav>
          <a href="index.html" target="_blank">Home</a>
          <a href="about.html" target="_blank">About</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="content-width">
        <h1>NFL Stadiums Collection</h1>
        <hr />
        <!-- Dallas Cowboys -->
        <figure>
          <article class="stadium-article">
            <a href="https://www.attstadium.com/" target="_blank">
              <h2>AT&T Stadium</h2>
            </a>
            <img src="images/AttStadium.jpg" alt="AT&T Stadium" />
            <p><strong>Category:</strong> Indoor/Dome</p>
            <p>
              <strong>Description:</strong> Home of the Dallas Cowboys, stadium
              located in Arlington, Texas.
            </p>
            <p><strong>Seating Capaity:</strong> ~100,000</p>
          </article>
        </figure>
        <figure>
          <!-- New York Giants -->
          <article class="stadium-article">
            <a href="https://www.metlifestadium.com/" target="_blank">
              <h2>MetLife Stadium</h2>
            </a>
            <img src="images/Metlife.jpg" alt="Metlife Stadium" />
            <p><strong>Category:</strong> Outdoor/Open</p>
            <p>
              <strong>Description:</strong> Shared home of the New York Giants
              and New York Jets, located in East Rutherford, New Jersey.
            </p>
            <p><strong>Seating Capacity:</strong> ~82,000</p>
          </article>
        </figure>
        <figure>
          <!-- Philadelphia Eagles -->
          <article class="stadium-article">
            <a
              href="https://www.merriam-webster.com/dictionary/cry%20baby"
              target="_blank"
            >
              <h2>Lincoln Financial Field</h2>
            </a>
            <img src="images/TheLinc.jpg" alt="Lincoln Financial Field" />
            <p><strong>Category:</strong> Outdoor/Open</p>
            <p>
              <strong>Description:</strong> Home of the Philadelphia Eagles,
              stadium located in Philadelphia, Pennsylvania.
            </p>
            <p><strong>Seating Capacity:</strong> ~69,000</p>
          </article>
        </figure>
      </div>
    </main>
    <footer>
      <div class="content-width"></div>
    </footer>
  </body>
</html>
