<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Add Stadium - NFL Stadiums Collection</title>
  </head>
  <body>
    <header class="site-header">
      <div class="content-width header-inner">
        <nav class="nav-left">
          <a href="index.html">Home</a>
          <a href="#">Schedule</a>
          <a href="about.html">About</a>
        </nav>

        <div class="site-branding">
          <a href="index.html">
            <img src="https://upload.wikimedia.org/wikipedia/en/a/a2/National_Football_League_logo.svg" alt="NFL Logo" class="header-logo">
          </a>
        </div>

        <nav class="nav-right">
          <a href="add.html" class="active">Add Stadium</a>
          <a href="#">Tickets</a>
          <a href="#">Contact Us</a>
        </nav>
      </div>
    </header>

    <main class="content-width">
      <div class="form-container">
        <h1>Add a New Stadium</h1>
        <p class="form-intro">
          Use the form below to submit a stadium to the collection.
        </p>

        <form action="#" method="post" enctype="multipart/form-data" class="stadium-form">
          <div class="form-group">
            <label for="stadium-name">Stadium Name</label>
            <input type="text" id="stadium-name" name="stadium-name" minlength="2" placeholder="e.g., AT&T Stadium" required />
          </div>

          <div class="form-group">
            <label for="team-name">Team Name</label>
            <input type="text" id="team-name" name="team-name" minlength="2" placeholder="e.g., Dallas Cowboys" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="capacity">Seating Capacity</label>
              <input type="number" id="capacity" name="capacity" min="10000" max="130000" placeholder="e.g., 80000" required />
            </div>

            <div class="form-group">
              <label for="stadium-type">Stadium Type</label>
              <select id="stadium-type" name="stadium-type" required>
                <option value="">-- Select Type --</option>
                <option value="outdoor">Outdoor / Open</option>
                <option value="indoor">Indoor / Dome</option>
                <option value="retractable">Retractable Roof</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" placeholder="e.g., Arlington, Texas" required />
          </div>

          <div class="form-group">
            <label for="stadium-image">Stadium Photo</label>
            <input type="file" id="stadium-image" name="stadium-image" accept="image/*" required />
          </div>

          <button type="submit" class="submit-btn">Submit Stadium</button>
        </form>
      </div>
    </main>

    <footer>
    </footer>
  </body>
</html>
